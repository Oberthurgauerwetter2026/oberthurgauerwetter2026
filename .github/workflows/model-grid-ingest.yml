name: Model Grid Ingest (Schweiz)

on:
  schedule:
    # 4x täglich, kurz nach den üblichen Modellläufen (UTC)
    - cron: "35 2,8,14,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: model-grid-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        model:
          - meteoswiss_icon_ch1
          - meteoswiss_icon_ch2
          - icon_d2
          - meteofrance_arome_france
          - meteofrance_arpege_europe
          - icon_eu
          - ecmwf_ifs025
          - gfs_global
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Ingest ${{ matrix.model }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 60
          command: python -u scripts/ingest_model_grid.py
        env:
          MODEL: ${{ matrix.model }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OPENMETEO_PROXY_URL: ${{ secrets.OPENMETEO_PROXY_URL }}
          OPENMETEO_PROXY_KEY: ${{ secrets.OPENMETEO_PROXY_KEY }}

  index:
    runs-on: ubuntu-latest
    needs: ingest
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Build index.json
        run: python -u scripts/ingest_model_grid.py
        env:
          MODE: index
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
